global:
  scrape_interval: 5s

scrape_configs:

  # 🟢 Spring Boot services
  - job_name: 'spring-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - gateway:8080
          - screening:8081
          - questionnaire:8082

  # 🟢 FastAPI / AI
  - job_name: 'fastapi-services'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - interpreter:8000
          - classifier:9000

  # 🟢 Node backend
  - job_name: 'node-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - backend:5001

  # 🟢 cAdvisor (containers)
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - cadvisor:8080

  # 🟢 Redis exporter (optional later)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets:
  #         - redis:6379