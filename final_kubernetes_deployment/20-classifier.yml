# ── Classifier Deployment + Service ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier
  namespace: mindsky
  labels:
    app: classifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: classifier
  template:
    metadata:
      labels:
        app: classifier
    spec:
      containers:
        - name: classifier
          image: pratyaksht219/mindsky-classifier:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: classifier
  namespace: mindsky
spec:
  selector:
    app: classifier
  ports:
    - port: 9000
      targetPort: 9000
