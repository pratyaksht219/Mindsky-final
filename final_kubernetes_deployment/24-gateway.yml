# ── Gateway Deployment + Service ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: mindsky
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: pratyaksht219/mindsky-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SCREENING_SERVICE_URL
              value: "http://screening:8081"
            - name: QUESTIONNAIRE_SERVICE_URL
              value: "http://questionnaire:8082"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: mindsky
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
