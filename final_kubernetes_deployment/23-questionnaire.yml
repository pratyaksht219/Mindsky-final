# ── Questionnaire Deployment + Service ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: questionnaire
  namespace: mindsky
  labels:
    app: questionnaire
spec:
  replicas: 1
  selector:
    matchLabels:
      app: questionnaire
  template:
    metadata:
      labels:
        app: questionnaire
    spec:
      containers:
        - name: questionnaire
          image: pratyaksht219/mindsky-questionnaire:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: AI_SERVICE_URL
              value: "http://ai:8000"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: questionnaire
  namespace: mindsky
spec:
  selector:
    app: questionnaire
  ports:
    - port: 8082
      targetPort: 8082
