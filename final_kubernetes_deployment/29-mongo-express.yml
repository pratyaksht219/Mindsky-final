# ── Mongo Express (Compass Web) Deployment + Service ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: mindsky
  labels:
    app: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
        - name: mongo-express
          image: haohanyang/compass-web
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CW_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_URI
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
  namespace: mindsky
spec:
  type: NodePort
  selector:
    app: mongo-express
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30002
