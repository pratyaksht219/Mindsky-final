# ── Emergency Service Deployment + Service ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emergency
  namespace: mindsky
  labels:
    app: emergency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emergency
  template:
    metadata:
      labels:
        app: emergency
    spec:
      containers:
        - name: emergency
          image: pratyaksht219/mindsky-emergency-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgis-db:5432/crisis_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgis-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgis-secret
                  key: POSTGRES_PASSWORD
            - name: TWILIO_SID
              valueFrom:
                secretKeyRef:
                  name: twilio-secret
                  key: TWILIO_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: twilio-secret
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_NUMBER
              valueFrom:
                secretKeyRef:
                  name: twilio-secret
                  key: TWILIO_NUMBER
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: emergency
  namespace: mindsky
spec:
  selector:
    app: emergency
  ports:
    - port: 8084
      targetPort: 8084
