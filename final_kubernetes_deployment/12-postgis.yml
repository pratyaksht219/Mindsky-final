# ── PostGIS Deployment + Service ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgis-db
  namespace: mindsky
  labels:
    app: postgis-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgis-db
  template:
    metadata:
      labels:
        app: postgis-db
    spec:
      containers:
        - name: postgis-db
          image: postgis/postgis:15-3.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgis-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgis-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgis-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgis-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "crisis_db"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "crisis_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgis-data
          persistentVolumeClaim:
            claimName: postgis-data-pvc
        - name: init-sql
          configMap:
            name: postgis-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgis-db
  namespace: mindsky
spec:
  selector:
    app: postgis-db
  ports:
    - port: 5432
      targetPort: 5432
